name: Release EtherDrop

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: etherdrop-release
  queue: max

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Test updater and release versioning
        run: python -m unittest discover -s tests -v
      - name: Prepare version and release notes
        id: prepare
        run: python scripts/prepare_release.py
      - name: Install build dependency
        run: python -m pip install pyinstaller
      - name: Build standalone executable
        shell: cmd
        run: build.bat
      - name: Commit and tag the release
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etherdrop.py EtherDrop.manifest RELEASE_NOTES.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore: release v$env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git tag "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --atomic origin HEAD:release "v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: gh release create "v$env:RELEASE_VERSION" dist/EtherDrop.exe --verify-tag --title "EtherDrop v$env:RELEASE_VERSION" --notes-file RELEASE_NOTES.md --latest
